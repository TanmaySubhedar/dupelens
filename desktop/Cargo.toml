[package]
name = "dupelens-desktop"
description = "DupeLens: the app (ui/ in a native Tauri window) and its terminal commands"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
default-run = "dupelens"

[[bin]]
name = "dupelens"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The engine and its CLI commands, without the local web server: Tauri is the host here.
dupelens-core = { path = "../core", default-features = false, features = ["cli"] }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }

# Image decoding is painfully slow unoptimised: optimise dependencies even in debug builds
# (same as the workspace; desktop/ is outside it, so it needs its own copy).
[profile.dev.package."*"]
opt-level = 2

[profile.release]
strip = true
