[package]
name = "dupelens-desktop"
description = "DupeLens: the app (ui/ in a native Tauri window) and its terminal commands"
version = "0.2.1"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
default-run = "dupelens"

# The app is a library plus a thin program: Android loads the library (cdylib) and calls into
# it, while desktop runs the program. The library name must differ from the program's.
[lib]
name = "dupelens_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "dupelens"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The engine and its CLI commands, without the local web server: Tauri is the host here.
dupelens-core = { path = "../core", default-features = false, features = ["cli"] }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
tauri = { version = "2", features = [] }
# Android-only system calls (storage permission, screen insets); answers "not supported" elsewhere.
tauri-plugin-dupelens-device = { path = "../plugins/device" }

# The folder dialog is desktop-only; Android has no picker that returns plain paths.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }

# Image decoding is painfully slow unoptimised: optimise dependencies even in debug builds
# (same as the workspace; desktop/ is outside it, so it needs its own copy).
[profile.dev.package."*"]
opt-level = 2

[profile.release]
strip = true
