<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>DupeLens</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <!-- Relative paths and no inline script/style: the same files work from the local server
       and inside a Tauri window, under a strict Content-Security-Policy. -->
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="icon.svg" alt="" width="26" height="26"> DupeLens <span id="version" class="muted small"></span></div>
    <div class="topbar-right">
      <span class="offline-note muted small">Works offline · nothing leaves this computer</span>
    </div>
  </header>
  <main id="main" tabindex="-1"><p class="muted">Loading…</p></main>
  <div id="toasts" aria-live="polite"></div>
</body>
</html>
