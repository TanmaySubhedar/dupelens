<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>DupeLens</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <!-- Relative paths and no inline script/style: the same files work from the local server
       and inside a Tauri window, under a strict Content-Security-Policy. -->
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <picture>
        <source srcset="logo-dark.svg" media="(prefers-color-scheme: dark)">
        <img src="logo-light.svg" alt="" width="24" height="24">
      </picture>
      <span>DupeLens</span> <span id="version" class="muted"></span>
    </div>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <div class="spacer"></div>
    <span class="offline-note muted small">Works offline. Nothing leaves this computer.</span>
  </header>
  <main id="main" tabindex="-1"><p class="muted">Loading…</p></main>
  <div id="toasts" aria-live="polite"></div>
</body>
</html>
