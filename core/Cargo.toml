[package]
name = "dupelens-core"
description = "Offline duplicate photo detection engine for DupeLens"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "dupelens_core"

[[bin]]
name = "dupelens"
path = "src/bin/dupelens.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff", "rayon"] }
kamadak-exif = "0.6"
rayon = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
walkdir = "2"

# The OS trash is unavailable on mobile; deletion there is permanent-only.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
trash = "5"

[dev-dependencies]
tempfile = "3"
