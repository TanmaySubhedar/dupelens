# Builds a DEBUG Android APK of the current pages, to install on a real phone and see whether
# the pages load there at all (docs/decisions/0016-android-app.md, step 1).
#
# Not a release: the debug APK is signed with a throwaway debug key and is not published.
# Start it from the Actions tab (Run workflow), or by pushing to a branch named android/*.
# The APK comes out as a downloadable "artifact" at the bottom of the finished run's page.
name: Android

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Build in release mode (unsigned) to test the build the Release workflow does"
        type: boolean
        default: false
  push:
    branches: ["android/**"]

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Java 17 (Android's Gradle build tool needs it)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install the Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          # The runner already has the SDK. The action's default extra package ("tools")
          # no longer exists in current command-line tools and fails the step.
          packages: ""

      - name: Install the Android platform, build tools and NDK
        # The NDK is Google's C/C++ compiler for Android. The engine needs it because its
        # bundled SQLite is C code. The platform, build tools and NDK versions are pinned; the Rust toolchain follows "stable".
        run: |
          sdkmanager --install "platforms;android-34" "platforms;android-36" "build-tools;34.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install Rust and the Android phone target
        # aarch64 is the 64-bit ARM chip in practically every phone made in the last decade.
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Reuse compiled dependencies between runs
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Install the Tauri command-line tool (pinned to the version of the tauri crate in Cargo.lock)
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2.12.1

      - name: Generate the Android project
        # Tauri writes the Gradle/Kotlin project into desktop/gen/android (not committed).
        working-directory: desktop
        run: cargo tauri android init --ci

      - name: Use the DupeLens launcher icon
        # "android init" fills the project with Tauri's stock icon. Overwrite it with ours
        # (made by scripts/make_android_icons.py and kept in desktop/icons/android).
        run: |
          res=desktop/gen/android/app/src/main/res
          test -d "$res" || { echo "no $res"; exit 1; }
          cp -r desktop/icons/android/. "$res"/
          ls "$res"/mipmap-xxxhdpi

      - name: Build the APK (debug, or release when asked for)
        working-directory: desktop
        run: |
          if [ "${{ inputs.release }}" = "true" ]; then
            cargo tauri android build --apk --target aarch64
          else
            cargo tauri android build --debug --apk --target aarch64
          fi

      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: dupelens-debug-apk
          path: desktop/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
