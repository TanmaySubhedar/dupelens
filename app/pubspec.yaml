name: dupelens
description: Find and clean up duplicate photos, entirely offline.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.9.0 # Flutter 3.35+ (RadioGroup)

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  # Must match the flutter_rust_bridge version in rust/Cargo.toml exactly.
  flutter_rust_bridge: 2.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
